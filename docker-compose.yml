version: '3.8'

services:
  backend:
    build: .
    container_name: nexus-ai-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - LLM_PROVIDER=mock
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ui:
    build: .
    container_name: nexus-ai-ui
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
